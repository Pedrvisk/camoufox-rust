[package]
name = "camoufox"
description = "Facade crate and CLI for camoufox-rust: LaunchOptions, PreparedLaunch, launch. Inspired by camoufox-js (https://github.com/apify/camoufox-js) and Camoufox (https://github.com/daijro/camoufox)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["camoufox", "antidetect", "fingerprint", "browser", "playwright"]
categories = ["web-programming", "command-line-utilities"]

[[bin]]
name = "camoufox"
path = "src/main.rs"

[dependencies]
camoufox-core.workspace = true
camoufox-pkgman.workspace = true
camoufox-geoip.workspace = true
camoufox-webgl.workspace = true
camoufox-virtdisplay.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
tempfile.workspace = true
rand.workspace = true
veilus-fingerprint.workspace = true

[dev-dependencies]
tempfile.workspace = true
