[workspace]
resolver = "2"
members = [
    "crates/camoufox-core",
    "crates/camoufox-pkgman",
    "crates/camoufox-geoip",
    "crates/camoufox-webgl",
    "crates/camoufox-virtdisplay",
    "crates/camoufox",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MPL-2.0"
authors = ["camoufox-rust contributors"]
description = "Rust launcher and toolbox for the Camoufox anti-detect browser"

[workspace.dependencies]
camoufox-core = { path = "crates/camoufox-core" }
camoufox-pkgman = { path = "crates/camoufox-pkgman" }
camoufox-geoip = { path = "crates/camoufox-geoip" }
camoufox-webgl = { path = "crates/camoufox-webgl" }
camoufox-virtdisplay = { path = "crates/camoufox-virtdisplay" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
rand = "0.8"
quick-xml = "0.36"
indicatif = "0.17"
zip = "2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
maxminddb = "0.24"
veilus-fingerprint = "0.1"
dirs = "5"
walkdir = "2"
tempfile = "3"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
nix = { version = "0.29", features = ["fs", "signal"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
