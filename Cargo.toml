[workspace]
resolver = "2"
members = [
    "crates/camoufox-core",
    "crates/camoufox-pkgman",
    "crates/camoufox-geoip",
    "crates/camoufox-webgl",
    "crates/camoufox-virtdisplay",
    "crates/camoufox-store",
    "crates/camoufox-juggler",
    "crates/camoufox",
    "crates/camoufox-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
license = "MPL-2.0"
authors = ["Pedro <support@pedrovisk.dev>"]
description = "Rust launcher and toolbox for the Camoufox anti-detect browser. Inspired by camoufox-js (https://github.com/apify/camoufox-js) and Camoufox (https://github.com/daijro/camoufox)."
repository = "https://github.com/Pedrvisk/camoufox-rust"
homepage = "https://github.com/Pedrvisk/camoufox-rust"
documentation = "https://github.com/Pedrvisk/camoufox-rust#readme"
readme = "README.md"
keywords = ["camoufox", "antidetect", "fingerprint", "browser", "automation"]
categories = ["web-programming", "asynchronous"]

[workspace.dependencies]
camoufox-core = { path = "crates/camoufox-core", version = "0.3.0" }
camoufox-pkgman = { path = "crates/camoufox-pkgman", version = "0.3.0" }
camoufox-geoip = { path = "crates/camoufox-geoip", version = "0.3.0" }
camoufox-webgl = { path = "crates/camoufox-webgl", version = "0.3.0" }
camoufox-virtdisplay = { path = "crates/camoufox-virtdisplay", version = "0.3.0" }
camoufox-store = { path = "crates/camoufox-store", version = "0.3.0" }
camoufox-juggler = { path = "crates/camoufox-juggler", version = "0.3.0" }
camoufox = { path = "crates/camoufox", version = "0.3.0" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
rand = "0.8"
quick-xml = "0.36"
indicatif = "0.17"
zip = "2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
maxminddb = "0.24"
veilus-fingerprint = "0.1"
dirs = "5"
walkdir = "2"
tempfile = "3"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
nix = { version = "0.29", features = ["fs", "signal"] }
async-trait = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
